[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-rd-agent"
version = "1.0.0"
description = "A-Share Quantitative Strategy Autonomous Evolution Control Plane"
readme = "README.md"
authors = [{ name = "Quant Platform Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
